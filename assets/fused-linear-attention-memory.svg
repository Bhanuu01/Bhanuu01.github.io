<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Fused linear attention memory and shared-memory layout</title>
  <desc id="desc">Diagram showing the unfused baseline path writing Q, K, and V through HBM, and the custom tiled path staging tiles in shared memory with T equals 64 and d plus one padding.</desc>
  <rect width="1200" height="700" fill="#f7f8fa"/>
  <rect x="50" y="55" width="1100" height="590" rx="28" fill="#ffffff" stroke="#d7dbe2" stroke-width="2"/>
  <text x="85" y="110" font-family="Georgia, serif" font-size="34" fill="#152338">Fused attention: where the memory path changed</text>

  <rect x="85" y="150" width="430" height="430" rx="24" fill="#f4f6fa" stroke="#d7dbe2"/>
  <text x="115" y="198" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#283966">Unfused baseline</text>
  <rect x="130" y="228" width="120" height="60" rx="14" fill="#e8edf7"/>
  <text x="162" y="265" font-family="Arial, sans-serif" font-size="20" fill="#152338">X</text>
  <rect x="310" y="228" width="150" height="60" rx="14" fill="#e8edf7"/>
  <text x="342" y="265" font-family="Arial, sans-serif" font-size="20" fill="#152338">QKV GEMM</text>
  <rect x="170" y="342" width="250" height="72" rx="18" fill="#fbe8e6" stroke="#d77d72"/>
  <text x="220" y="385" font-family="Arial, sans-serif" font-size="22" fill="#8a3c31">HBM write + read</text>
  <rect x="310" y="470" width="150" height="60" rx="14" fill="#e8edf7"/>
  <text x="355" y="507" font-family="Arial, sans-serif" font-size="20" fill="#152338">SDPA</text>
  <path d="M250 258 H300" stroke="#3b4f86" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M385 288 V332" stroke="#3b4f86" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M295 414 V462 H310" stroke="#3b4f86" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="118" y="560" font-family="Arial, sans-serif" font-size="18" fill="#4e5869">Q, K, and V materialize in HBM between projection and attention.</text>

  <rect x="565" y="150" width="550" height="430" rx="24" fill="#f4f8fc" stroke="#cfd8ea"/>
  <text x="595" y="198" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#283966">Custom tiled path</text>
  <rect x="610" y="228" width="120" height="60" rx="14" fill="#e8edf7"/>
  <text x="642" y="265" font-family="Arial, sans-serif" font-size="20" fill="#152338">X</text>
  <rect x="790" y="228" width="250" height="188" rx="18" fill="#ffffff" stroke="#8fa4cf" stroke-width="2"/>
  <text x="832" y="268" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#283966">Shared memory tile</text>
  <text x="820" y="304" font-family="Courier New, monospace" font-size="18" fill="#4e5869">T = 64 rows</text>
  <text x="820" y="334" font-family="Courier New, monospace" font-size="18" fill="#4e5869">d + 1 padded stride</text>
  <text x="820" y="364" font-family="Courier New, monospace" font-size="18" fill="#4e5869">sQ / sK / sV / sO</text>
  <rect x="820" y="386" width="180" height="14" rx="7" fill="#c4d0e9"/>
  <rect x="820" y="408" width="180" height="14" rx="7" fill="#c4d0e9"/>
  <rect x="820" y="430" width="180" height="14" rx="7" fill="#c4d0e9"/>
  <rect x="820" y="452" width="180" height="14" rx="7" fill="#c4d0e9"/>
  <rect x="790" y="470" width="180" height="60" rx="14" fill="#e8edf7"/>
  <text x="820" y="507" font-family="Arial, sans-serif" font-size="20" fill="#152338">Attention output</text>
  <path d="M730 258 H780" stroke="#3b4f86" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M915 416 V462" stroke="#3b4f86" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="610" y="340" width="120" height="70" rx="16" fill="#edf3ef" stroke="#b7cdbd"/>
  <text x="628" y="382" font-family="Arial, sans-serif" font-size="20" fill="#3d5946">No QKV round-trip</text>
  <text x="596" y="560" font-family="Arial, sans-serif" font-size="18" fill="#4e5869">The best hybrid path kept projection on cuBLAS and replaced attention with a warp-cooperative bf16 kernel.</text>

  <rect x="85" y="602" width="1030" height="24" rx="12" fill="#e8edf7"/>
  <text x="100" y="620" font-family="Arial, sans-serif" font-size="17" fill="#283966">Verified artifacts from the project: up to 54.6% lower estimated HBM reads, 1.22x at N = 64, and 1.41x at N = 128.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b4f86"/>
    </marker>
  </defs>
</svg>
